[package]
name = "muxsmith-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "muxsmith"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.5.2"
fluent-bundle = "0.16.0"
muxsmith-core = { path = "../muxsmith-core" }
schemars = "1.2.2"
serde_json = "1.0.151"
sys-locale = "0.3.2"
unic-langid = "0.9.6"

[dev-dependencies]
assert_cmd = "2.2.2"
fluent-syntax = "0.12.0"
# Exact-pin per toolchain doctrine; registry-verified current stable
# (crates.io API, 2026-07-12): insta 1.48.0 is max_stable_version.
# `filters`: plain-string regex redaction for CLI stdout/stderr snapshots
# (tempdir paths, mkvmerge version banners, job durations); `redactions`
# is the wrong feature here, it targets structured (JSON/YAML) snapshots.
insta = { version = "=1.48.0", features = ["filters"] }
# Already pinned identically in muxsmith-core; reused here (not a new
# dependency in the resolved tree) only for `regex::escape` when building
# a per-test tempdir filter (tests/support/mod.rs).
regex = "1.13.1"
tempfile = "3.27.0"
