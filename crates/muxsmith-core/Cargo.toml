[package]
name = "muxsmith-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dirs = "6.0.0"
language-tags = "0.3.2"
regex = "1.12.4"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_path_to_error = "0.1.20"
time = { version = "0.3.53", features = ["formatting", "parsing"] }
ts-rs = { version = "12.0.1", optional = true }
yaml_serde = "0.10.4"

[features]
# D44: TypeScript bindings for the IPC wire, feature-gated so ts-rs never
# reaches a default build (or any other workspace member's build - see D44's
# xtask-rejection rationale). Generation: `cargo test -p muxsmith-core
# --features ts`.
ts = ["dep:ts-rs"]

[dev-dependencies]
# Exact-pin per toolchain doctrine; registry-verified current stable
# (crates.io API, 2026-07-11): proptest 1.11.0 is max_stable_version.
proptest = "=1.11.0"
tempfile = "3.27.0"
