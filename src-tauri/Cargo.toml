[package]
name = "muxsmith-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "muxsmith_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "muxsmith-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
dirs = "6.0.0"
muxsmith-core = { path = "../crates/muxsmith-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.2", features = [] }
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tauri-plugin-os = "2.4.0"
time = { version = "0.3.55", features = ["formatting"] }

[dev-dependencies]
tempfile = "3.27.0"
