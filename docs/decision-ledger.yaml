  nature: process
  domain: process
  statement: "A control proves an instrument sees the dimension the CLAIM is about, and nothing else. A value mutation proves a comparison notices changed content; it does not prove the comparison notices changed ORDER, so where order is semantic the control set needs a reorder as well. A pattern fire proves the pattern matches; it does not prove the SELECTOR reaches the file, so a check whose scope is a file selector (git ls-files -- '*.rs' '*.ts', a glob, a path filter) needs a control that widens or moves the selector. Trigger is readable: you are about to call a check verified because one control fired. Ask which property that control varied, and enumerate the properties the claim actually rests on. A third dimension hides INSIDE the instrument: where the pattern carries an alternation - the mechanisms, extensions, spellings or keywords it enumerates - that set is a claim of its own, and firing the pattern against one known-present member proves nothing about a member you left out. Derive such a set from the artifact, never from recall of what should be in it."
