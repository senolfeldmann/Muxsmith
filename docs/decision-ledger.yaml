- id: proc-reuse-mandate-names-the-signature
  kind: pattern
  tier: 1
  source: agent-emergent
  nature: process
  domain: process
  statement: "A REUSE MANDATE in a brief or plan ('reuse X, do not write a new one') names X's EXACT signature and shows every argument coming from the task's own inputs. A mandate that names only the function is an assertion that a seam exists, and the assertion is what keeps being wrong: the target's signature does not accept what the task actually holds, and the gap is invisible because the mandate reads as settled reuse rather than as an open question. Latitude concentrates in the SEAM BETWEEN two correctly-enumerated sets, not inside either - enumerate-don't-describe does not reach the interface between enumerations, so the connection is a third thing to enumerate. Trigger is readable: you are typing the name of an existing function into a normative instruction. Handle: paste its signature next to it and trace each parameter to the task's inputs; a parameter you cannot source is a fork, not a detail."
  steelman: "A brief that carries every reuse target's full signature is a brief that duplicates the codebase into prose, goes stale on the first refactor, and costs the implementer nothing it could not get from one grep. The implementer reads the function before calling it anyway - that is the job, and proc-57 already binds them to verify load-bearing premises at the source. Rejected on the evidence: in both recorded cases the mandate's confidence is exactly what suppressed the grep. A named reuse target reads as a settled fact rather than a claim, so it is not treated as a premise to check, and the failure surfaces at the keyboard where the doctrine forbids resolving it."
  blocked_on: null
  status: settled
  promoted_at: null
  count: 2
  occurrences:
    - {date: "2026-07-15", kind: violated-corrected, ref: "plan-6 design-brief mandated 'the logic exists as a test helper apply_edit_to_first_rule (tests/suggestions.rs:95). Reuse before writing: hoist it into the library.' Refuted by the design implementer: it takes no Profile, mutates nothing, and hardcodes the fixture's own conditions as string literals - a fixture generator, not apply logic. Recorded as the design's correction #1"}
