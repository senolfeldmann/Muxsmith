  statement: "A plan or brief that fences an exact figure as an acceptance value must first ask who else writes the thing that figure counts. Where a co-writer appends to it during the run - the controller writing ledger entries, a parallel task adding catalog keys - a fenced number converts that legitimate append into a spurious task failure, and the implementer's correct move becomes arguing with its own contract. Trigger: the figure counts rows, entries or keys in a file the acceptance step does not own. Handle: fence the INVARIANT rather than the value - the exit code, the output's shape, the phrase that means all checks passed - and let the count float. This is not licence to drop figures generally: a figure over an artifact the task DOES own stays fenced, because there the drift is the defect."
