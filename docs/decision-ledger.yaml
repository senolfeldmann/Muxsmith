- id: a-stated-expression-is-verified-by-executing-the-documents-own-text
  kind: pattern
  tier: 1
  source: agent-emergent
  nature: process
  domain: process
  statement: "Re-running an expression to check its figure is not the same as executing the expression the document CONTAINS, and the gap is invisible from inside: a reader who retypes the command silently supplies the target file the document forgot, the pathspec that lives in the surrounding prose, or the pattern the markup mangled - and then reports a figure the document cannot produce. Trigger: you are about to verify a figure by running its expression. Handle: copy the expression's characters out of the document and execute THAT string; where it is not self-contained, the defect is the document, not your run. Corollaries measured in one round: an expression split between a fenced command and prose that names its scope is not executable; a table cell escapes pipe characters, so a pattern pasted into one matches a literal backslash and returns zero; a character class containing a backtick closes its own inline code span, so what renders is not what was written. Consequence for authoring: fence the WHOLE invocation - flags, target and pathspec - and never restate an expression in a table cell; reference the fenced copy instead."
