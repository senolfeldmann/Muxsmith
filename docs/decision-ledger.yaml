  statement: "A fix loop's stopping point is readable from two monotone series rather than from a judgement about whether the artifact is good enough: the severity of each round's worst finding, and the share of the artifact taken up by its own self-review and amendment narration. While severity falls round on round and the meta-text share rises round on round, the next round is buying less than it costs, and the honest move is to stop applying the instrument to THIS artifact - not to declare it defect-free. Trigger: you are deciding whether to route another round. Handle: state both series with their measured values and let them decide; and where a general clause was introduced mid-loop, say explicitly that it must not be run again here, because a clause that earned its keep is exactly what gets re-applied out of habit. Related but distinct from the widen-twice convergence trigger, which fires on the SHAPE of two consecutive findings; this fires on the loop's economics."
