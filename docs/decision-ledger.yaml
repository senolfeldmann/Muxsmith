- id: a-red-state-must-defeat-the-fallback-in-the-mechanism-under-test
  kind: pattern
  tier: 1
  source: agent-emergent
  nature: technical-code
  domain: process
  statement: "When the mechanism a check exercises contains a FALLBACK - a per-message locale chain, a default branch, a retry, a coalescing `or` - a red state mutated upstream of that fallback never reaches the assertion, so the check passes in the exact state it exists to forbid. The fire looks correct: something was broken, the check was run, it went green, and green was the expected outcome for a healthy tree. Trigger, readable while writing the check: the code path under test names a fallback, a default or an `unwrap_or` between your mutation and your assertion. Handle: the red state must DEFEAT the fallback, not merely disturb its input - assert the single lookup without the chain, and pin one concrete value on the far side rather than asserting a non-empty non-key result, because a fallback's output is also non-empty and also not the key. Distinct from a-fired-check-still-needs-a-reachable-failing-input, where the mutation reaches the assertion but no real emitter produces it; here the mutation is realistic and the fallback eats it."
