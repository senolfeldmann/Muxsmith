- id: a-producer-is-graded-by-whether-it-would-pass-with-the-mechanism-broken
  kind: pattern
  tier: 1
  source: agent-emergent
  nature: process
  domain: process
  statement: "Reviewing coverage by asking `does this observable have a producer?` finds missing rows and misses useless ones - the row exists, so nothing looks absent. The sharper question, asked per producer rather than per observable: WOULD THIS PRODUCER STILL PASS IF THE MECHANISM IT COVERS WERE BROKEN? Where the answer is yes, the row is documentation, not coverage, and the observable is uncovered while the map says otherwise. Trigger: you are ticking a coverage map. Handle: for each row, name the concrete broken state and predict the row's result; a row that survives its own mechanism's failure is rewritten or split, and the half that cannot fail says so in its own text. Generalizes the acceptance-halves rule from `each side needs a producer` to `each side needs a producer that discriminates`."
