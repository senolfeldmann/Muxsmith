- id: a-number-in-prose-carries-a-unit-claim-that-re-measuring-does-not-check
  kind: pattern
  tier: 1
  source: agent-emergent
  nature: process
  domain: process
  statement: "Every number stated in prose asserts a UNIT as well as a value, and re-measuring the value does not check the unit. Two failure shapes, both live: (1) UNIT DRIFT - the figure was correct under the unit available when it was written, the world later made two units diverge, and re-measuring under the original unit reproduces the stale figure and reads as CONFIRMATION rather than as staleness; (2) RANGE IMPLIES COUNT - 'X through Y' asserts contiguity, so it states a count as a side effect, and a gap in the series makes the range true and the implied count false. Handle: name the unit the prose claims, establish which unit the ORIGINAL figure used (measure at the commit that introduced it, which git makes cheap), and measure today under both. Where they diverge, the prose is what broke, not the number. Where the claim is a range over a series, count the members rather than trusting the endpoints. Trigger is readable: you are re-measuring a figure an older document states, in order to decide whether it is still true. A unit is WELL-FORMED when its plausible re-readings converge: state it so that every reasonable reading of the words returns the same number, and say which reading you measured. That is a stronger property than merely naming a unit, and it is what lets the next reader re-derive the figure without guessing which sense was meant."
