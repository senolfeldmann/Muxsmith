- id: a-synchronous-parity-precedent-loses-its-licence-when-translated-into-async
  kind: pattern
  tier: 1
  source: agent-emergent
  nature: technical-code
  domain: cross
  statement: "A borrowed pattern from the reference tool carries the CONDITIONS that made it correct there, and the commonest silently-dropped condition is synchronicity. `saved = current()` is sound in a synchronous handler because nothing can move between the read and the write; translated into a path with an await between capture and mark, the same line reads a state the write did not use. Trigger, readable: you are citing a reference-tool precedent for an assignment, and your version of that code path contains an await, a callback, a dialog or any yield the original did not. Handle: mark the value the operation actually USED, captured before the first yield, not the live value at completion time - and when citing the precedent, state the condition that licensed it rather than only its shape. This is a caveat on the project's standing parity duty (SI-3), not an argument against it: the comparison is still owed, and it is the precedent's LICENCE that has to cross the boundary with its shape."
