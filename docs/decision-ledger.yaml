- id: brief-citations-drift-after-amendment
  kind: pattern
  tier: 1
  source: agent-emergent
  nature: process
  domain: process
  statement: "A brief's line-number citations into a design document drift when the design is amended after the brief was cut (plan-6: Task 1 shifted the design by ~35 lines; T9's brief cited :1082-1091 for content actually at :1117-1139). Content matched in every observed case, so cost was zero - but nothing re-verifies a brief's citations post-amendment. When dispatching after a document amendment, the dispatch says 'line positions may have shifted; the text is the anchor'; a citation-freshness check becomes worth building if this recurs where CONTENT, not just position, drifted."
