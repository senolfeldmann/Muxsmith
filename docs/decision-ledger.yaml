- id: a-new-test-says-whether-the-behavior-or-the-assertion-is-new
  kind: pattern
  tier: 1
  source: agent-emergent
  nature: process
  domain: process
  statement: "A test added beside a feature states which of two things it establishes: that the BEHAVIOR is new, or that the ASSERTION is new. They look identical in a plan and differ completely in evidence - a test whose behavior already exists on the pre-feature tree cannot go red before the feature lands, so any claim that it will is false, and the test's real value is that nothing asserted the behavior until now. The distinction matters most where a mocked boundary feeds the assertion: the mock supplies the new input shape by hand, so the test never exercises the producer whose change the plan is actually about, and the consequence is covered by two tests in a chain rather than one end to end. Trigger is readable: you are writing 'this test fails on today's tree' about a test you are adding. Handle: run it on today's tree, and if it passes, say so and name the chain that covers the rest."
