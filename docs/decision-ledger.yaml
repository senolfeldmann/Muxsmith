- id: gui-typed-scalar-needs-typed-input
  kind: pattern
  tier: 1
  source: agent-emergent
  nature: technical-code
  domain: gui
  statement: "A widget that edits a typed Scalar must offer a type-appropriate input: a string-only value cell can only ever produce Scalar::Str, so Bool/Int settables (forced, default) are unenterable as valid values and hit a permanent ValueTypeMismatch - the same Str(\"true\")-where-Boolean shape the D49 record already carries at the engine layer, reproduced at the GUI layer. T10's PropertyMapWidget ships string-only; core catches the mistype at error severity and the save-disable affordance (T12/13) blocks the frontend path, so nothing reaches a mux run silently through the GUI. Resolution: typed cells land in Plan 6 via the T12 amendment (owner ruling 2026-07-16)."
  steelman: null
  blocked_on: null
  status: settled
  promoted_at: null
  count: 2
  occurrences:
