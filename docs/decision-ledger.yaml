- id: proc-guard-needs-its-control
  kind: pattern
  tier: 1
  source: agent-emergent
  nature: process
  domain: process
  statement: "A guard asserting that some input PRODUCES an error is paired with a control asserting the neighbouring input does NOT - otherwise the guard passes unchanged against an implementation that errors unconditionally, which is the degenerate implementation the guard was written to exclude. Sibling of proc-verification-step-must-be-falsifiable and the same failure in the positive direction: that entry covers a check whose expectation is an absence, this one a check whose expectation is a presence that a broken implementation supplies for free. Trigger is readable: you are writing assert!(matches!(result, Err(..))). Handle: write the Ok case beside it, from the nearest input that should NOT trip it."
  steelman: "Every error test would double, and the pairs are obvious enough that a reviewer reading them sees the gap - a rule here spends test volume on a defect that has not shipped. Rejected because the control is one assertion on a fixture the guard already builds, and the degenerate implementation it excludes is not exotic: an early return, an inverted condition, or a predicate that is always true all produce it, and all leave the guard green. Cheap insurance against the one failure the guard cannot self-report."
