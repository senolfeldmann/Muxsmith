- id: gui-editor-widget-test-mount-harness
  kind: pattern
  tier: 1
  source: agent-emergent
  nature: technical-code
  domain: testing
  statement: "Editor widget/view e2e verification before the nav exists (plan-6 tasks 10-12) runs against a minimal test-mount harness extending the established e2e harness pattern (test-only artifacts, gitignored e2e/.generated/, never dist/) - not deferred to the nav-wiring task as compile-only proofs. The harness imports the app's own buildBundles so the mounted components render the real catalogs. Amendment four-eyes authored and committed (add3ab9)."
