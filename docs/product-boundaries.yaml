- id: core-15-transcoding-out
  kind: restraint
  tier: 2
  source: user-decree
  nature: product-scope
  domain: core
  statement: "Transcoding is permanently out of scope; the tool only muxes."
  steelman: "A convert-and-remux step would serve users whose source codecs the target player cannot handle - but that is a fundamentally different tool."
  blocked_on: null
  status: settled
  promoted_at: 1
