- id: core-17-wildcard-multitrack-out
  kind: restraint
  tier: 2
  source: user-decree
  nature: product-scope
  domain: core
  statement: "'Keep all remaining audio' wildcard rules are rejected for v1 because they break strict independent uniqueness; a later explicit multi:true form is named but not committed."
  steelman: "mkvtoolnix's 'keep all remaining tracks of type X' is a common convenience; strict uniqueness forces enumerating every track explicitly."
  blocked_on: null
  status: settled
  promoted_at: 1
  count: 1
  occurrences:
    - {date: "2026-07-08", kind: decided, ref: "spec §11"}
- id: exec-02-no-in-place
  kind: restraint
  tier: 2
  source: user-decree
  nature: product-scope
  domain: executor
  statement: "Muxsmith never writes over its inputs; in-place replacement is excluded as a hard, non-configurable rule, and an output path equal to any input is always a hard error."
  steelman: "In-place metadata editing (mkvpropedit-style) would save disk space and avoid a separate output directory for small tweaks."
  blocked_on: null
  status: settled
  promoted_at: 1
  count: 1
  occurrences:
    - {date: "2026-07-08", kind: decided, ref: "spec §1 + §2 row 4 + §11"}
- id: exec-15-batch-no-hardkill-default
  kind: restraint
  tier: 2
  source: controller-adr
  nature: product-scope
  domain: executor
  statement: "Hard-kill of in-flight jobs on first failure was rejected as the batch default; a failure does not abort the batch. mkvtoolnix-gui has no fail-fast (model.cpp:337-380 calls startNextAutoJob unconditionally); make/cargo/GNU-parallel stop scheduling and let running jobs finish; kill+delete-partial is reserved for mkvmerge error or user cancel."
  steelman: "On systemic failures (disk full, unwritable dir) a hard-kill stops the siblings immediately instead of letting them run seconds longer."
  blocked_on: null
  status: settled
  promoted_at: 1
  count: 1
  occurrences:
    - {date: "2026-07-09", kind: decided, ref: "memo D14"}
- id: exec-26-perjob-cancel-defer-rejected
  kind: restraint
  tier: 2
  source: user-decree
  nature: product-scope
  domain: executor
  statement: "Shipping only batch cancel with per-job cancel deferred to a later plan was declined by Şenol (a deviation from spec 8.2)."
