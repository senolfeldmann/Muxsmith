# Muxsmith product boundaries (Tier 2, nature = product-scope)
#
# What the product IS and ISN'T. The owner/controller reads this when scoping a feature; an agent must not cross a boundary here or add one (agent-emergent product-scope escalates to the owner - doctrine section 7).
#
# Entry schema (canonical copy in software-dev-process doctrine section 7):
#   id, kind (pattern|restraint|non-decision), tier (=2 here),
#   source (human|agent-emergent),
#   nature (product-scope|technical-code|process|operational),
#   domain, statement, steelman (restraint), blocked_on (non-decision),
#   status (settled|contested|blocked), promoted_at, count (== len(occurrences)),
#   occurrences: [{date, kind (decided|reinforced|violated-corrected|deferred), ref}]
# Promotion by the source x nature matrix (doctrine section 7).

entries:
- id: exec-44-runlog-14day-autoprune
  kind: pattern
  tier: 2
  source: human
  nature: product-scope
  domain: executor
  statement: "Run-log pruning was left out of v1 at D26 (location documented, prune facility parked), then reversed at D35 to an automatic 14-day fixed prune with no v1 config, implemented in core executor/joblog so CLI and GUI both inherit; age is decided by the parsed run-id name only (never mtime), pruning best-effort and symlink-safe with every IO error ignored. Parity MATCH with mkvtoolnix removeOldJobs=true/14 days."
  steelman: null
