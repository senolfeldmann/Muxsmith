- id: core-83-zero-rule-keep-passthrough
  kind: pattern
  tier: 2
  source: human
  nature: product-scope
  domain: core
  statement: "A zero-rule profile with tracks.unmatched=keep is a LEGAL pure-passthrough remux (all primary tracks copied; use it to change only title / attachments / chapters, or to normalize the container, without any track rule). With tracks.unmatched=drop, zero rules stays a NoTrackRules error. MUST be documented and hinted - the passthrough path via unmatched=keep is non-obvious. (Şenol ruling, escalation resolution, session 10.)"
  steelman: null
  blocked_on: null
  status: settled
  promoted_at: 2
  count: 2
  occurrences:
