- id: editor-generic-action-keys
  kind: pattern
  tier: 2
  source: human
  nature: product-scope
  domain: gui
  statement: "gui-editor.ftl carries two GENERIC action keys - editor-action-add (en 'Add', de 'Hinzufügen') and editor-action-remove (en 'Remove', de 'Entfernen') - and every generic list/map control in the editor renders THEM; the domain-scoped editor-attachment-rule-add/-drop keys caption only the AttachmentRule fields they name. The editor catalog budget is deliberately REVISED 43 -> 45 (42 labels + 1 save note + 2 action keys) by the same ruling, and REVISED AGAIN 45 -> 46 by the plan-7 design (D59): the 46th id is the rule-grid ordinal column header editor-track-rule-order, while the plan-7 tooltip pass adds ZERO ids (tooltips land as Fluent .tooltip attributes of existing messages); the budget stays a hard boundary against prose growth. The T12 amendment carries the catalog and widget changes; the two de strings ride the plan-close de pass."
  steelman: "Reusing the AttachmentRule keys adds zero entries against the closed budget and cross-view key reuse is an established house pattern (browse-button); rejected because the coupling is latent (an AttachmentRule-specific rewording would silently change every list/map button) and de 'Verwerfen' misreads as discard-my-changes where 'Entfernen' is the conventional remove."
  blocked_on: null
  status: settled
  promoted_at: 2
  count: 3
  occurrences:
    - {date: "2026-07-16", kind: deferred, ref: "plan-6 T10 review verdict Q2: reuse judged acceptable-on-merits, routing to the governing human required (user-visible wording, proc-latitude routing rule)"}
    - {date: "2026-07-16", kind: decided, ref: "Şenol ruling (plan-6 owner escalation, option 1b of the enumerated options): generic keys over reuse; budget revision 43 -> 45 is part of the ruling"}
    - {date: "2026-07-21", kind: decided, ref: "plan-7 design D59 + design trigger 10 (owner-approved design): budget revision 45 -> 46 for the ordinal header key, tooltip pass attribute-only; the design's round-1 review flagged the unrecorded revision, this occurrence records it"}
