  statement: "Plans run via subagent-driven-development under a controller: a fresh implementer per task, an independent task reviewer, fix/re-review waves, and a final whole-branch review; the plan never grades its own work. Adopted at Plan 1, deviated to inline once at Plan 2 (self-verified '125 tests green' but shipped ~11 bugs, retrofit review caught them all before merge), then held for every subsequent plan and folded into the packaged doctrine."
