- id: proc-paraphrase-names-authority
  kind: pattern
  tier: 2
  source: agent-emergent
  nature: process
  domain: process
  statement: "When a document restates a rule - or reports another document's finding or proof - whose normative home or source is elsewhere, the restatement names its authority inline and subordinates itself ('X is the authority; this sentence follows its mechanics') - a bare paraphrase drifts into a competing variant that later readers cannot rank, and a compressed report of a finding drifts into claims the source never made. Trigger is readable: you are describing behavior or evidence that another passage defines. Handle: cite the defining passage and mark the sentence as derived; report a tested pattern by the pattern actually tested."
