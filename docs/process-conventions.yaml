- id: tests-ship-with-the-feature-never-after
  kind: pattern
  tier: 2
  source: human
  nature: process
  domain: process
  statement: "A package that creates a user-visible consequence ships the test for that consequence IN THE SAME package. Deferring the test to a later item is not an acceptable resolution of a missing producer, and neither is recording the gap honestly: honesty about an uncovered consequence closes a reporting defect, not the coverage defect underneath it. Trigger is readable: you are about to write 'no producer exists', 'coverage rides <later item>', or 'tests follow in <plan>' about behavior THIS package introduces. Handle: add the producer here, or establish that the consequence is not user-visible. The boundary this does NOT override: new test INFRASTRUCTURE (a harness, a runner, a framework) may still be deferred - what may not be deferred is a scenario the existing infrastructure can already express. PRECEDENCE, owner-ruled 2026-07-28 because a plan's enumerated pinned tests and this rule collided and nothing ranked them: at EXECUTION time this rule wins over a plan's test enumeration, narrowly - the implementer BUILDS the missing producer instead of routing it when all four hold: the test is ADDITIVE (no existing assertion, fixture value or helper touched), it runs on EXISTING infrastructure, the consequence is one THIS package's own diff creates, and the addition is named in the report so the reviewer rules on it. Outside those four the enumeration still binds and the fork returns. The reason the exemption is safe in this direction and not the other: an unnecessary added test is visible to the reviewer and cheap to reject, while a missing one is invisible by construction - Task 3's gap left the whole workspace green with the persisted field deleted."
  steelman: "Deferring keeps a package's scope where its owner cut it, and a recorded uncovered consequence is at least visible rather than silent - which is what the controller argued when it routed exactly this deferral. Rejected by the owner: writing the feature and handing in its test later is the practice the rule exists to prevent, and the scope argument proves too much, since every feature's tests can be argued out of scope by the same reasoning."
  blocked_on: null
  status: settled
  promoted_at: 1
  count: 3
  occurrences:
    - {date: "2026-07-28", kind: decided, ref: "Owner ruling on the Task-3 escalation (plan-9 task-3-verdict.md F1 + its HARVEST 2): the precedence sentence above, plus the companion plan-review handle recorded in the controller doctrine - every acceptance observable is walked in its HALVES to a named producing test, because Task 3's gap came from a plan whose acceptance map claimed one producer for an observable with a rendered and a persisted side. Owner chose that pairing over routing every instance as NEEDS_CONTEXT: the review handle removes the cause, the precedence makes the remainder cheap"}
    - {date: "2026-07-28", kind: decided, ref: "Owner ruling at the Plan 9 plan-approval gate, overturning a controller routing: during the design fix round the controller routed the two producer-less acceptance observables (D101's GUI Run-gate consequence, D103's edited branch) as 'restate honestly, add no e2e tests'. Both scenarios fit the existing Playwright plus mock-IPC harness, so only the scenarios were missing. Routed into plan-9 amendment 1 (.superpowers/sdd/plan-9/amendment-1-brief.md)"}
    - {date: "2026-07-28", kind: reinforced, ref: "plan-9 Task 5: the rule fired at execution time for the second consecutive task, and again on a TOTAL gap. D102's hoisted sort is applied at two call sites and the plan enumerated a producer for one; the implementer measured the other unguarded (workspace green with batch_document's sort removed), ran the four conditions, and BUILT the missing producer rather than routing it. The reviewer re-measured with a symmetric mutation pair and sharpened the datum: each call site has exactly one guard, the guards are disjoint, neither test is redundant (.superpowers/sdd/plan-9/task-5-verdict.md adjudication 1). The same review corrected the implementer's reasoning on a SECOND consequence: the GUI display order does satisfy condition 3, and what disposes of it is that the shipped core and CLI tests already produce it - the stated failed-condition reason would have licensed skipping a genuinely uncovered core-produced consequence next time"}
- id: owner-manual-qa-gates-the-1-0-release
  kind: pattern
  tier: 2
  source: human
  nature: process
  domain: process
  statement: "No 1.0 release is cut before Şenol has personally run a manual QA and bug-hunting pass against a current build on his own hardware. It is a precondition on the tag, not a review of finished work, and three shapes of output are first-class scope input by his own framing: real bugs; behaviour he does not like even where it matches the spec; and items parked in v1.x that he decides belong in 1.0 after all. Trigger is readable: you are about to call the pre-1.0 scope complete, propose the tag, or plan the release. Handle: establish whether that pass has run and produced its findings - if it has not, the remaining scope is unknown and no completeness claim about 1.0 may be made, however short the ROADMAP's open list looks. Two corollaries: finishing every item in the ROADMAP's pre-1.0 gates section does NOT close 1.0 scope, and a build he can install has to exist before the pass can run at all, which makes producing that build pre-1.0 work in its own right. PRECEDENCE against the neighbouring rule: this stacks on the doctrine's milestone gate rather than replacing it - this pass gates the SCOPE and runs first, the milestone gate still runs its trigger sweep, leak audit and claim-language check immediately before the irreversible step."
