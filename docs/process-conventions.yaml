- id: proc-latitude-clause-boundary
  kind: restraint
  tier: 2
  source: human
  nature: process
  domain: process
  statement: "NO artifact an implementer reads carries an unresolved design question or a design-latitude clause - not the brief, not a design document, not a spec, not a review verdict, not a fix-round dispatch ('if you find a simpler equally-safe alternative, implement it' is banned). OMISSION is the commoner form and a keyword scan cannot see it: a set mandated but never enumerated, a list ending in '...', a placeholder, a 'one per X' with no X list. The test is not 'does a permission appear?' but 'must the implementer invent something it is not allowed to invent?' - any unenumerated set in a normative position is latitude, and the question is asked of every normative sentence rather than of the vocabulary. The set's SIZE and DERIVABILITY are not exemptions: 'the same shape as X' hands over the fork as completely as an ellipsis does, and a derivable member is exactly what a wrong derivation produces - if the member could be derived wrong, deriving it is the work, and the work is what the enumeration exists to do. Reviewers check the document they grade for both forms. Every decision a task requires is settled in spec/ADR/brief before dispatch, or the dispatch waits. A fork discovered mid-task returns as NEEDS_CONTEXT with a decision memo (options, costs against the named invariants, recommendation) and is routed BEFORE it is resolved; routing by fork nature: product-scope or user-visible behavior -> the governing human, always; internal technical/process forks -> the controller decides and records it (ADR when interface/wire-format relevant; solo only when none of the doctrine's observable contested criteria holds - recorded-statement collision, post-memo judgment divergence, invariant trade without recorded ranking, ledger recurrence while contested - guru/panel otherwise)."
  steelman: "For latitude: some design costs (ripple breadth, hidden consumers) only materialize on code contact, and a sanctioned+documented+adjudicated deviation beats a silent one - the plan-5.8 T4 case produced a correct result this way. Rejected because: a sanctioned fork licenses per-task scope drift and erodes the brief's bindingness; a real developer would not decide such a question alone either; stop-and-ask via cheap resumption achieves the same surfacing with decision authority kept central."
  blocked_on: null
  status: settled
  promoted_at: 2
  count: 10
  occurrences:
    - {date: "2026-07-27", kind: violated-corrected, ref: "plan-7.5 plan review round 1 m2 (docs/process-journal/artifacts/plan-7.5-sdd/plan-review-round-1.md): Step 5 granted a comment permission that Step 6's permitted-delta enumeration over the same artifact omitted - an incomplete enumeration in a normative position at plan-step scale (the reviewer's framing: an enumeration is a dependency, sibling-step grants must be absorbed); fix round completes the enumeration"}
