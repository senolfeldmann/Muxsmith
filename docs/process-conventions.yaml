- id: proc-latitude-clause-boundary
  kind: restraint
  tier: 2
  source: human
  nature: process
  domain: process
  statement: "NO artifact an implementer reads carries an unresolved design question or a design-latitude clause - not the brief, not a design document, not a spec, not a review verdict, not a fix-round dispatch ('if you find a simpler equally-safe alternative, implement it' is banned). OMISSION is the commoner form and a keyword scan cannot see it: a set mandated but never enumerated, a list ending in '...', a placeholder, a 'one per X' with no X list. The test is not 'does a permission appear?' but 'must the implementer invent something it is not allowed to invent?' - any unenumerated set in a normative position is latitude, and the question is asked of every normative sentence rather than of the vocabulary. Reviewers check the document they grade for both forms. Every decision a task requires is settled in spec/ADR/brief before dispatch, or the dispatch waits. A fork discovered mid-task returns as NEEDS_CONTEXT with a decision memo (options, costs against the named invariants, recommendation) and is routed BEFORE it is resolved; routing by fork nature: product-scope or user-visible behavior -> the governing human, always; internal technical/process forks -> the controller decides and records it (ADR when interface/wire-format relevant; solo only when none of the doctrine's observable contested criteria holds - recorded-statement collision, post-memo judgment divergence, invariant trade without recorded ranking, ledger recurrence while contested - guru/panel otherwise)."
  steelman: "For latitude: some design costs (ripple breadth, hidden consumers) only materialize on code contact, and a sanctioned+documented+adjudicated deviation beats a silent one - the plan-5.8 T4 case produced a correct result this way. Rejected because: a sanctioned fork licenses per-task scope drift and erodes the brief's bindingness; a real developer would not decide such a question alone either; stop-and-ask via cheap resumption achieves the same surfacing with decision authority kept central."
  blocked_on: null
  status: settled
  promoted_at: 2
  count: 5
  occurrences:
    - {date: "2026-07-15", kind: deferred, ref: "plan-5.8 task-4 brief R3 latitude exercised + first owner review (adoption declined, kept open)"}
    - {date: "2026-07-15", kind: decided, ref: "Şenol ruling (session 14 process review, round 2): unresolved design questions never reach an implementer; latitude clauses banned; NEEDS_CONTEXT decision memo is the channel; doctrine §3 amended"}
    - {date: "2026-07-15", kind: decided, ref: "Şenol ruling (session 14, round 3): contested/tough defined by observable criteria replacing the controller-flag trigger; doctrine §7 amended"}
    - {date: "2026-07-15", kind: violated-corrected, ref: "Şenol ruling (session 15): the ban widened to every artifact an implementer reads and to LATITUDE BY OMISSION. Evidence: the plan-6 design document mandated 'one registry per edited struct' and never listed the structs, and the reviewer's keyword scan passed it clean; three controller fix-round dispatches carried 'push back rather than complying', which the implementer read as licence to decide-then-report. doctrine §3 amended"}
    - {date: "2026-07-16", kind: violated-corrected, ref: "Second omission instance in the SAME approved design document, found at plan-authoring after four review rounds: D41 fixed the save writer at Result<_, Diagnostic> (:132-133) but never named the DiagCode, and none exists in report/mod.rs's diag_codes! for a write/IO failure. The implementer would have had to invent a user-facing diagnostic code AND its en+de prose (catalog_completeness.rs matches DiagCode exhaustively). The document's own 'Every fork in this document is closed' (:11) and section 8's 'What the implementer must not decide' both passed it. Escalated per this entry's routing rule (user-visible -> the governing human); Şenol ruled SaveError -> IpcError (core-124-error-currency-split)"}
- id: proc-57-briefs-not-ground-truth
  kind: pattern
  tier: 2
  source: human
  nature: process
  domain: process
  statement: "A claim a brief or plan uses as a LOAD-BEARING PREMISE of a decision is verified at the source before it is acted on, whether or not the controller tagged it VERIFY-FIRST; incidental facts are not. The tag survives as a pointer - it says where the controller already doubts - but is no longer the gate: nobody tags the premise they are sure of, so a tag-gated duty catches only known unknowns, and the misses cluster in the untagged set by construction. Refuting a premise is a valid completion (keep + record), never a failed task. Complements proc-07 rather than replacing it: proc-07 cuts on SUBJECT (tooling and dependency behavior, wherever it appears), this cuts on ROLE (premise of a decision, whatever its subject); neither subsumes the other."
  steelman: "A brief carries dozens of claims; a duty to re-verify all of them turns every task into an audit and doubles its cost, and an unenforceable rule gets ignored - a narrow rule that holds beats a broad one nobody follows. The VERIFY-FIRST tag exists precisely so the controller can point at what matters, and the controller is usually right about what matters. Rejected because the evidence runs the other way: every recorded miss to date was untagged, which is not bad luck but the mechanism - a controller cannot tag a doubt it does not have. Scoping to load-bearing-premise-of-a-decision, rather than to every claim, keeps the cost bounded without keeping the blind spot."
  blocked_on: null
  status: settled
  promoted_at: 4
  count: 4
  occurrences:
    - {date: "2026-07-13", kind: violated-corrected, ref: "plan-5.6 task-4 verdict: the brief's anchor list summed 19, stated 20, real 21 - untagged arithmetic over the tree"}
    - {date: "2026-07-13", kind: violated-corrected, ref: "plan-5.6 task-8 verdict Important #1: the brief asserted rust-toolchain.toml components apply on a bare rustup toolchain install (false, rustup #4216); untagged, only the reviewer caught it; fix 308effc"}
    - {date: "2026-07-15", kind: violated-corrected, ref: "plan-6 design-brief premise 'the apply logic exists as a test helper, hoist it' refuted by the design implementer: tests/suggestions.rs:95 is a fixture generator that takes no Profile and mutates nothing; untagged"}
    - {date: "2026-07-15", kind: decided, ref: "Şenol ruling (session 15): the duty binds on ROLE - a load-bearing premise of a decision, tagged or not - and not on every incidental fact; contested scoping question closed"}
- id: proc-no-work-needed-check
  kind: pattern
  tier: 2
  source: human
  nature: process
  domain: process
  statement: "Where a passage concludes that a guard, an enumeration or a check is UNNECESSARY, the reviewer verifies the claim that makes it unnecessary. Run it; do not weigh it. The trigger is readable in the text ('so we need no X', 'X cannot be done here', 'the work already exists'), which is what makes this a check rather than an exhortation: 'notice when you are reaching for a reason to stop' is not executable, 'the paragraph ends in therefore-unnecessary, so go run the premise' is."
  steelman: "Trusting a competent author's reasoning is cheaper than re-running every premise, and a reviewer who re-derives everything is a second implementer rather than a reviewer. Rejected because this specific shape is empirically unreliable and, decisively, is not fixable by care: it survived the author's own written diagnosis of it. Awareness does not prevent it; an external check does."
  blocked_on: null
  status: settled
  promoted_at: 1
  count: 1
  occurrences:
    - {date: "2026-07-15", kind: decided, ref: "Şenol ruling (session 15). Evidence from the plan-6 design round: the shape produced three false claims - an unenumerated set (which was hiding a real 20-files defect), an unguarded second copy, and a flat 'D48 cannot derive' that ninety seconds of compiling refuted. The third appeared in the same document that had just conceded the pattern in writing. doctrine §7 brief-wiring amended"}
- id: proc-proposed-safeguard-stays
  kind: pattern
  tier: 2
  source: human
  nature: process
  domain: process
  statement: "A guard, test, enumeration or check that a design document or plan has PROPOSED is not argued out again during the design or planning phase. It is removed only after it is built and MEASURED redundant. Rationale: the argument for dropping one always has the no-work-needed shape (proc-no-work-needed-check), and in the design phase that shape is uniquely UNFALSIFIABLE - a test that does not exist cannot be run to show it tests nothing, so agreement stands in for a measurement, and two agreeing agents are not one. Asymmetry: a redundant safeguard costs one redundant test; a wrongly-dropped one costs a silent hole in an unbuilt plan that nobody re-derives, because the document says the matter is settled. Keep the vacuity analysis and re-aim it: it becomes the recorded reason the safeguard is a candidate for removal at implementation time, under a trigger that names the experiment."
  steelman: "A design document that knowingly ships a test which cannot fail is shipping noise, and noise that reads as coverage is worse than an admitted gap - the honest move is to drop it and say so. Rejected because it assumes the vacuity claim is true, which is precisely what the design phase cannot establish; the claim is verifiable one phase later at trivial cost, and until then a redundant test is the cheaper error."
  blocked_on: null
  status: settled
  promoted_at: 1
  count: 1
  occurrences:
    - {date: "2026-07-15", kind: decided, ref: "Şenol ruling (session 15), applied retroactively to the already-approved plan-6 design document: its own proposed schema-annotation guard had been dropped as 'a tautology' (reviewer proposed, implementer complied, neither able to check it) in the same round where that rationale shape had already produced three false claims. Guard restored; the tautology analysis re-aimed onto a falsifiable trigger. doctrine §3 amended"}
- id: proc-normative-count-recomputed
  kind: pattern
  tier: 2
  source: agent-emergent
  nature: process
  domain: process
  statement: "A COUNT stated in a normative document ('20 named inputs', '11 variants', 'two new Fluent keys', 'the split is 6/5/1/8') is a claim about an enumeration that sits elsewhere in the same document, and it is recomputed from that enumeration - by the author when writing it and by the reviewer when grading it. Never asserted from the drafting intent. The trigger is readable, which is what makes this a check and not an exhortation: you are typing a number that summarizes a list. Two failure shapes, both recorded: the count contradicts its own list (recount and fix), or the list does not exist yet (that is latitude by omission - proc-latitude-clause-boundary - and the count is unauthorable until the enumeration is written, which is the stronger reason to write it)."
  steelman: "Counts are decoration: the enumeration is what binds, a reader who needs the number can count the rows, and a wrong count has never by itself produced a defect - so a rule policing them spends review attention on cosmetics. Rejected on the recorded evidence: the plan-6 design's own D45 recount ('the label said 11 while the union defined 10') sat forty lines from where that same document raised the identical defect against the ROADMAP, which is not a cosmetic failure but a reliable signal that the enumeration behind the number was never walked. Where the count was checked, the walk found real defects (the ROADMAP recount exposed 4 unlisted design inputs; closing D45's ellipsis exposed a 20-file defect it had been hiding)."
  blocked_on: null
