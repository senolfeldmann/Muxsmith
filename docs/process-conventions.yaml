- id: proc-wrapped-prose-quote-grep
  kind: pattern
  tier: 2
  source: agent-emergent
  nature: process
  domain: process
  statement: "Text-verification tooling against prose/documents anchors on CONTENT, never on line positions: quote-existence checks are whitespace-tolerant (line-based greps false-negative on soft-wrapped sentences), and block re-extractions key on structural anchors like code fences (fixed line ranges produce phantom deltas once surrounding edits shift them). The make-the-check-fire discipline applies to the checker's own tooling: confirm the pattern against a known-present case before trusting an absence - and treat a surprising one-line delta as a tooling suspect before a finding. (Statement widened from quote-greps to extraction tooling on the second occurrence's evidence.)"
