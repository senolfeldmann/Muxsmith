# Muxsmith process & operational conventions (Tier 2, nature = process + operational)
#
# How we work: method, gates, CI, release. Project-specific; complements the general software-dev-process doctrine, it does not restate it.
#
# Entry schema (canonical copy in software-dev-process doctrine section 7):
#   id, kind (pattern|restraint|non-decision), tier (=2 here),
#   source (human|agent-emergent),
#   nature (product-scope|technical-code|process|operational),
#   domain, statement, steelman (restraint), blocked_on (non-decision),
#   status (settled|contested|blocked), promoted_at, count (== len(occurrences)),
#   occurrences: [{date, kind (decided|reinforced|violated-corrected|deferred), ref}]
# Promotion (Tier 1 -> Tier 2) by the source x nature matrix: human (decided/ratified
# by a human) promotes at count 1 (authority); agent-emergent promotes at
# count 3 (recurrence), except agent-emergent x product-scope AND
# agent-emergent x new-standing-structure (a new tracker/file class with its
# own lifecycle), which both escalate to the owner (doctrine section 7,
# Şenol ruling 2026-07-15). count is always len(occurrences); an occurrence is a distinct
# decision EVENT, not a distinct document of one event.

