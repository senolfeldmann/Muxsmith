- id: proc-06-mkvtoolnix-parity
  kind: pattern
  tier: 2
  source: agent-emergent
  nature: process
  domain: process
  statement: "Because mkvtoolnix is interactive-GUI and Muxsmith is declarative-batch, only muxing semantics/output are parity targets, not input-time convenience guesses. Comparable behavior is verified against the real mkvtoolnix binary/source (not memory), match or deliberate divergence recorded in the memo. Licensing boundary: reading GPL source for behavior/facts/interfaces is MIT-compatible, literal expression is not, and modeled wordings are recorded as explicit memo decisions."
  steelman: null
