- id: proc-03-model-assignment
  kind: pattern
  tier: 2
  source: agent-emergent
  nature: process
  domain: process
  statement: "Model strength goes where judgment is, cheaper capacity where transcription is: strongest model for the final review and the decision memos (incl. design/plan four-eyes rounds), mid-tier for judgment implementers and every task reviewer, cheapest for tasks whose code the plan already carries. DISPATCH-TIME HANDLE (added 2026-07-21 after the tiering silently failed): the trigger is writing an Agent dispatch; the handle is an EXPLICIT model parameter on every dispatch, chosen by this tiering - an omitted parameter inherits the session default, which is not an assignment but the absence of one, and silently defeats the tiering whenever the default is the top model. The doctrine (section 0 skill-loading line, section 4 dispatch duty) carries the same handle framework-side. OWNER BOUND (2026-07-21, re-instantiated 2026-07-27, NARROWED 2026-07-28 on measured budget consumption - the occurrence log carries the evolution): the top model (currently Fable 5) serves ONE role, the plan-close whole-branch review including its delta re-reviews. Design four-eyes rounds, plan four-eyes rounds (both incl. delta/amendment rounds) and four-eyes decision documents moved DOWN to the mid tier. Ground, from the session that measured it: the whole-branch review is once per plan, is the last gate before an irreversible step, and is the only reviewer that sees the whole branch, so a cross-task defect has no other catcher - while every other former top-tier role demonstrably has one downstream (an Opus task reviewer proved a plan-level coverage gap by mutation, and an Opus implementer refuted an impossible plan-pinned test invocation, both in the same session in which four top-tier agents produced three findings for roughly 42 percent of the session's subagent tokens). The CONTROLLER LOOP runs the mid tier (currently Opus 5) - the owner sets it as the session main-loop model; task implementers, every task reviewer, fix dispatches, scoped re-reviews and recon run the mid tier as well; tasks whose code the plan already carries (transcription) run the cheap tier (currently Sonnet 5). Resumptions and in-flight runs continue on their spawn model; every fresh dispatch names its model explicitly."
  steelman: null
  blocked_on: null
  status: settled
  promoted_at: 3
  count: 11
  occurrences:
    - {date: "2026-07-28", kind: decided, ref: "owner ruling (S25) on measured consumption: the weekly top-model allowance stood at 66 percent on a Tuesday evening while all-model usage was 47 percent, on the largest available plan. Asked which single step keeps the top model, the controller named the plan-close whole-branch review and the owner adopted it; design/plan four-eyes rounds and decision documents drop to Opus. Two cost levers adopted with it, recorded framework-side because they are not project data: a small amendment gets ONE author and ONE reviewer for both its design and plan halves rather than four roles, and a tiny fix round goes to a fresh agent rather than resuming a large one, because resumption replays the whole prior transcript and its win is wall-clock and consistency, never tokens"}
    - {date: "2026-07-27", kind: decided, ref: "owner ruling (S22, in-session): controller loop moves OFF the top model to Opus 5 (owner judgment: Opus 5 is genuinely better; Fable reserved for the most important moments only) - top model now serves ONLY design/plan four-eyes rounds, whole-branch reviews + deltas, and four-eyes decision documents; statement re-instantiated on this ruling"}
    - {date: "2026-07-27", kind: decided, ref: "owner correction (S22, in-session): the mid tier is Opus 5, freshly released - the opus dispatch parameter already resolved to it, so this session's mid-tier dispatches factually ran Opus 5; statement's currently-clause updated, tiering shape unchanged"}
    - {date: "2026-07-08", kind: decided, ref: "journal 2026-07-08 model-split bullet (E0[6])"}
    - {date: "2026-07-09", kind: decided, ref: "journal 2026-07-09 Plan 2 Decisions (E2[19])"}
