- id: latitude-carveout-zero-content-structural-forks
  kind: pattern
  tier: 2
  source: human
  nature: process
  domain: process
  statement: "Ruled: proc-latitude-clause-boundary stays UNCHANGED - no carve-out for zero-decision-content structural forks. The exemption lives in the BRIEF instead: the standing implementer-brief wiring carries an explicit house-pattern grant ('follow the touched file's existing structural patterns; extending an unbroken local pattern with zero outward effect is in-scope without routing'). Zero outward effect means ALL FOUR hold: no API/symbol surface (nothing new or changed that code outside the change can see, import or call; no new dependencies); no data format (nothing crossing a serialization boundary changes shape); verification never weakened - additive, pattern-conforming test extensions ARE covered (a new case/row/block in an existing test file, or an additive fixture extension, shaped like its unbroken siblings and covering exactly the pattern-conforming code addition), while weakening, deleting, skipping or rewording an existing assertion, mutating existing fixture values, new test files, and new test infrastructure (harness, mocks, gate config) all stop; nothing user-visible (no strings, no catalog-key use at a new site, no layout, nothing a user or screen reader perceives). The grant fills SILENCE only - an explicit enumeration in brief, design or spec always wins over it - and it is controller-authored and pre-decided, never implementer-judged at the keyboard. Companion brief-authoring rule: a Files/Interfaces list reads as an enumeration boundary; EXEMPLARY lists are permitted, but the brief must mark them as exemplary explicitly - an unmarked list is exhaustive. That boundary runs over FILES (owner ruling 2026-07-28): an entry constrains work WITHIN its file only where it carries an explicit within-file qualifier - the word 'only', a named line span, a named region - and where it carries none, the grant fills the silence inside that file as it does anywhere else. Named in scope on that reading: repairing a reference which the task's OWN enumerated edit invalidated (a doc link, a comment referent, an import), inside a LISTED file, where nothing changes beyond the referent and all four zero-outward-effect conditions still hold. The same repair in an unlisted file stays out of scope and returns as a finding. ALSO named in scope (owner ruling 2026-07-28): ADDING a symbol import which the task's OWN enumerated addition requires, inside a LISTED file, where that addition does not compile without it and all four zero-outward-effect conditions still hold. This case survives an explicit within-file qualifier ('nothing else in the file' and its kin), because such a qualifier fences OTHER tasks' regions and not the addition's own prerequisites; the test is binary at the compiler rather than a judgement at the keyboard, and an import serving anything beyond the enumerated addition stays outside it. Over-restriction watch: reviewers are explicitly briefed to FLAG, in their harvest, any stop this boundary forced that they judge it should have covered - the boundary was set deliberately tight and revises on this evidence; such a finding is a wanted harvest item, not second-guessing."
  steelman: "A carve-out in the rule itself would spare the clause in every brief; rejected because 'zero decision content' would then be the implementer's own keyboard judgment - the exact self-assessment the latitude rule exists to remove. A strict test-surface ban (artifacts untouched, binary reviewer check) was drafted and rejected by the owner as over-restrictive: tests are code with house patterns, a pattern-conforming code extension normally carries a pattern-conforming test sibling, and banning that would make the grant near-useless while incentivising extensions WITHOUT their tests. The adopted line: verification may grow along its own pattern, never weaken."
  blocked_on: null
  status: settled
  promoted_at: 2
  count: 14
