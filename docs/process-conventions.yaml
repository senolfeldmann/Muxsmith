- id: proc-03-model-assignment
  kind: pattern
  tier: 2
  source: agent-emergent
  nature: process
  domain: process
  statement: "Model strength goes where judgment is, cheaper capacity where transcription is: strongest model for the final review and the decision memos (incl. design/plan four-eyes rounds), mid-tier for judgment implementers and every task reviewer, cheapest for tasks whose code the plan already carries. DISPATCH-TIME HANDLE (added 2026-07-21 after the tiering silently failed): the trigger is writing an Agent dispatch; the handle is an EXPLICIT model parameter on every dispatch, chosen by this tiering - an omitted parameter inherits the session default, which is not an assignment but the absence of one, and silently defeats the tiering whenever the default is the top model. The doctrine (section 0 skill-loading line, section 4 dispatch duty) carries the same handle framework-side. OWNER BOUND (2026-07-21, settled across four same-day rulings - the occurrence log carries the evolution): the top model (currently Fable 5) serves ONLY the controller loop, the plan-close whole-branch review, design/plan four-eyes rounds, and decision documents. Task implementers and every task reviewer run the mid tier (currently Opus 4.8); tasks whose code the plan already carries (transcription) run the cheap tier (currently Sonnet 5). Resumptions and in-flight runs continue on their spawn model; every fresh dispatch names its model explicitly."
