- id: a-search-whose-terms-come-from-memory-produces-a-false-absence
  kind: pattern
  tier: 2
  source: agent-emergent
  nature: process
  domain: process
  statement: "A search built from what you REMEMBER should be there, rather than derived from what IS there, returns a false absence that looks exactly like a true one. The trigger is readable: you are about to write a sentence of the form 'I checked and nothing turned up', and the pattern you checked with was composed from recall. The handle is the existing absence discipline aimed one level up at the instrument itself - derive the search terms from the artifact (list the extensions actually cited, grep the forms actually written) and fire the pattern once against a known-present case before reporting the empty result. Hardest case, and the one where it keeps happening: a negative claim about a document you are currently WRITING, because there the author is also the only reader and the search terms are necessarily drawn from memory of what was written rather than from what is on the page. A measuring expression carries TWO enumerations and both are claims: what it READS (the file selector - extensions, paths, globs) and what it MATCHES (the pattern and its alternations). Auditing one leaves the other unaudited, and a control fired against a known-present member passes for both while a missing member of either stays invisible - so derive each set from the artifact separately."
  steelman: null
  blocked_on: null
  status: settled
  promoted_at: 3
  count: 3
  occurrences:
    - {date: "2026-07-29", kind: violated-corrected, ref: "controller measurement of the comment line-citation corpus (ROADMAP Docs-accuracy entry, commit 240e179): the search enumerated the CITED file extensions from recall - rs, ts, vue, py, sh, toml, yml, json - and omitted md, so widening the owner's ruling past Rust widened the SOURCE languages and left the cited types untouched. Reported 17 sites; the plan author refuted it against the tree at 20 across 13 files, and the plan reviewer reproduced both the number and the mechanism (17 under the old extension set, 20 under the new, the delta being exactly the three README.md-citing lines)"}
    - {date: "2026-07-29", kind: violated-corrected, ref: "plan-10 plan review round 1 finding F2 (docs/process-journal/artifacts/plan-10-sdd/plan-review-round-1.md): the plan's self-review claimed the gate's part count appears nowhere outside Task 1's fenced deliverable, 'checked by grepping this document for the stale forms (ten-part, eleven-part, N parts per)'. The count does appear at the plan's own authoring-measurement line, and the searched forms are hyphenated compounds the document never uses - a negative check that could not have fired against what it audited, reported as though it had. Same document also contains the repo's cleanest FIRED negative control, applied to the tree; the asymmetry is the datum"}
    - {date: "2026-07-29", kind: violated-corrected, ref: "plan-10 Task 5 review finding 1 (docs/process-journal/artifacts/plan-10-sdd/task-5-verdict.md): the SELECTOR half, and the third instance on the same corpus. Both prescribed corpus expressions read only '*.rs' '*.ts' '*.vue' '*.mjs' '*.js' '*.py', so a surviving member of the swept class in .github/workflows/ci.yml - a comment citing queue.rs:73, itself already stale at HEAD - was invisible to a sweep that was otherwise complete and independently fire-controlled. The reviewer derived the cited-extension set from the tree own extension tally and ran it over every non-docs file: exactly one hit, fired control 1, negative control 0. Promotes on this occurrence"}
