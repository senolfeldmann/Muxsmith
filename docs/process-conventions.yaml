  domain: process
  statement: "Ruled: visual presentation tokens - exact colors, widths, spacing, minor styling - within the app's existing design language are implementer-owned and need no enumeration in designs, plans or briefs; a design saying 'the implementer writes the CSS' for such tokens is NOT a banned latitude clause. The boundary: anything semantic-carrying stays enumeration-bound - which severity maps to which color, what an icon means, layout structure, anything whose variation changes meaning rather than looks. Companion owner bar (same ruling): v1's visual standard is a reasonably good, usable layout the owner reviews on the shipped surface; deliberate visual refinement ('schick machen') is a 1.x ROADMAP item, not a per-design enumeration duty."
