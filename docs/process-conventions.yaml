- id: proc-normative-count-recomputed
  kind: pattern
  tier: 2
  source: agent-emergent
  nature: process
  domain: process
  statement: "A COUNT stated in a normative document ('20 named inputs', '11 variants', 'two new Fluent keys', 'the split is 6/5/1/8') is a claim about an enumeration that sits elsewhere in the same document, and it is recomputed from that enumeration - by the author when writing it and by the reviewer when grading it. Never asserted from the drafting intent. TWO readable triggers, which is what makes this a check and not an exhortation, and the second is the one that catches what the first cannot: (1) you are typing a number that summarizes a list; (2) **you are ADDING A MEMBER to an enumerated set - then grep every numeral and count-word describing that set**, because at that moment nobody is typing the number, the number is somewhere else and stale, and trigger 1 never fires. Three failure shapes, all recorded: the count contradicts its own list (recount and fix); the substance of an addition propagates everywhere while the prose describing its size does not; or the list does not exist yet (that is latitude by omission - proc-latitude-clause-boundary - and the count is unauthorable until the enumeration is written, which is the stronger reason to write it)."
  steelman: "Counts are decoration: the enumeration is what binds, a reader who needs the number can count the rows, and a wrong count has never by itself produced a defect - so a rule policing them spends review attention on cosmetics. Rejected on the recorded evidence: the plan-6 design's own D45 recount ('the label said 11 while the union defined 10') sat forty lines from where that same document raised the identical defect against the ROADMAP, which is not a cosmetic failure but a reliable signal that the enumeration behind the number was never walked. Where the count was checked, the walk found real defects (the ROADMAP recount exposed 4 unlisted design inputs; closing D45's ellipsis exposed a 20-file defect it had been hiding)."
  blocked_on: null
  status: settled
  promoted_at: 3
  count: 4
  occurrences:
