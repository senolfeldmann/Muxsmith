- id: a-document-never-cites-a-line-number-inside-itself
  kind: pattern
  tier: 2
  source: human
  nature: process
  domain: process
  statement: "A document never cites a line NUMBER inside ITSELF. Name what the line IS - the sentence, the table row, the fenced block, the section - because the name survives every insertion above it and the number does not. Owner ruling 2026-07-29, taken over the alternative of an update duty on his own reasoning that updating can simply be forgotten: a rule that requires someone to NOTICE is decoration. What makes the ban narrow rather than blunt is that the alternative costs nothing - a self-citation has a nameable container in every real case, and where it has none, giving that container a name improves the document. SCOPE, deliberately tight: this covers a citation into the SAME document only. A citation to ANOTHER file at a named commit stays permitted and wanted, because there the moment is part of the claim; the owner ruled the same day that comments-locate-by-symbol-never-by-line-number stays scoped to SOURCE comments and is NOT widened by this. Trigger is readable: you are typing a colon and digits pointing at the file you are writing in. Handle: name the container instead."
  steelman: "Keep the number and update it when it moves. Rejected by the owner in the same breath as it was raised, and the rejection is the rule's whole argument: an update duty has no readable trigger, so it is discharged only by someone remembering, and the number is wrong in the interval nobody noticed."
