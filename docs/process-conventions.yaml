- id: proc-03-model-assignment
  kind: pattern
  tier: 2
  source: agent-emergent
  nature: process
  domain: process
  statement: "Model strength goes where judgment is, cheaper capacity where transcription is: strongest model for the final review and the decision memos (incl. design/plan four-eyes rounds), mid-tier for judgment implementers and every task reviewer, cheapest for tasks whose code the plan already carries. DISPATCH-TIME HANDLE (added 2026-07-21 after the tiering silently failed): the trigger is writing an Agent dispatch; the handle is an EXPLICIT model parameter on every dispatch, chosen by this tiering - an omitted parameter inherits the session default, which is not an assignment but the absence of one, and silently defeats the tiering whenever the default is the top model. The doctrine (section 0 skill-loading line, section 4 dispatch duty) carries the same handle framework-side. OWNER BOUND (2026-07-21, re-instantiated 2026-07-27 - the occurrence log carries the evolution): the top model (currently Fable 5) serves ONLY design four-eyes rounds (author + reviewer incl. delta/amendment rounds), plan four-eyes rounds (same), plan-close whole-branch reviews incl. their delta re-reviews, and four-eyes decision documents. The CONTROLLER LOOP runs the mid tier (currently Opus 5) - the owner sets it as the session main-loop model; task implementers, every task reviewer, fix dispatches, scoped re-reviews and recon run the mid tier as well; tasks whose code the plan already carries (transcription) run the cheap tier (currently Sonnet 5). Resumptions and in-flight runs continue on their spawn model; every fresh dispatch names its model explicitly."
  steelman: null
  blocked_on: null
  status: settled
  promoted_at: 3
  count: 10
