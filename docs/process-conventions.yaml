- id: proc-check-green-state-reachable
  kind: pattern
  tier: 2
  source: agent-emergent
  nature: process
  domain: process
  statement: "Fire-verifying a check proves its RED state is reachable; it does not prove its GREEN state is - a sweep-completion grep whose pattern over-matches (hitting legitimate non-targets that the same change deliberately preserves, or generated/ignored files in scope) is permanently red no matter how correctly the sweep lands. Complement of proc-verification-step-must-be-falsifiable: that entry demands the check CAN fail, this one demands it CAN pass. Trigger is readable: you are writing a completion check for a sweep or migration. Handle: run the check against the intended END state (construct it locally or reason member-by-member against the enumerated survivors) and show the expected-pass is reachable, before the check enters the plan."
