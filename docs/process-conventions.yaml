- id: ci-04-dependabot-cadence
  kind: pattern
  tier: 2
  source: human
  nature: operational
  domain: ci
  statement: "Renovate (not Dependabot) activation is a firm PRE-1.0 commitment (owner call 2026-07-29), no longer deferred to a later decision. CADENCE, settled by the owner the same day: monthly, grouped per ecosystem (Cargo, npm, GitHub Actions), with security updates immediate and ungrouped. MAJOR updates get their OWN PRs and do not ride the ecosystem group (owner, same day): in a repo of exact pins under `-D warnings` a major is likely to be red, and inside the group it would hold a month of harmless patches hostage. MANAGERS: `rust-toolchain` on, `mise` OFF - the owner's reason is that mise is slated to leave anyway (see the ROADMAP's mise-out-of-CI item for the scope that is actually tracked; the ruling did not restate it). CONSEQUENCE the controller drew from that and records here rather than deciding silently: the npm manager's `packageManager` depType is disabled too, because pnpm is pinned in BOTH `mise.toml` and `package.json`'s `packageManager` field as a deliberate mirror, and managing one side while the other is unmanaged breaks the mirror - CI takes its pnpm from mise, a developer's corepack from `package.json`. Both pnpm pins therefore move by hand until mise leaves. The driver behind the whole shape is CI cost - every dependency PR triggers the full 3-OS matrix - though on a public repo that cost is wall-clock and review attention, not money. The accepted price is named rather than glossed: a broken dependency can sit unnoticed for up to four weeks, and a grouped PR that goes red has to be taken apart to find which member did it."
  steelman: null
  blocked_on: null
  status: settled
  promoted_at: 1
  count: 6
  occurrences:
    - {date: "2026-07-08", kind: deferred, ref: "journal 2026-07-08 open threads + ROADMAP residue R3"}
