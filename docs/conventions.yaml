- id: code-comment-line-citations-drift
  kind: pattern
  tier: 2
  source: agent-emergent
  nature: technical-code
  domain: cross
  statement: "A file:line citation in any durable artifact - a code comment, a design document, an amendment, a convention entry - is a claim, verified against the CURRENT tree at the moment of writing, like a normative count. Copying a span from an older sentence is re-asserting it unverified: line spans drift silently as the cited file evolves, and a verification label ('controller-verified') covers the verified BEHAVIOR claim, never coordinates attached to it later. Prefer an anchor that survives edits (function or symbol name, quoted text) plus the file; a bare span is checked at write time and re-checked whenever the citing sentence is touched - and whenever the SAME INITIATIVE rewrites a file it cites elsewhere, the citing document has re-staled its own span. TWO CITATION CLASSES, discriminated by the sentence the citation serves (ruled at the plan-7 close batch): a LIVE DESCRIPTIVE claim (describes what the system IS) gets re-pointed on drift; an EVIDENTIARY record (ground-truth snapshot, fork evidence, an amendment's description of replaced text - records what the author SAW) is never re-pointed (that would falsify the record): it gets a scoping qualifier naming the staling event, the original span verbatim, and a pointer to the live twin where one exists. Trigger is readable: you are typing (or pasting) file:line into a durable artifact. SECOND TRIGGER (added on the plan-7.5 T3 evidence): the line you are quoting contains a parenthetical of the form '(Dxx - ...)' or a gloss ON another decision - that is the CITING decision speaking, not Dxx; attribute the sentence to its actual host, not to the decision it paraphrases."
  steelman: null
  blocked_on: null
  status: settled
  promoted_at: 3
  count: 9
  occurrences:
    - {date: "2026-07-27", kind: violated-corrected, ref: "plan-7.5 T3 verdict LOW-3 (task-3-verdict.md): the task report attributed 'an unsaved model mutation touches no file' to D41; the string exists once in docs/, inside D66's parenthetical gloss ON D41 (plan-7.5 design) - a quote credited to the decision it paraphrases, in a durable process artifact; product content unaffected (independently licensed by D71's anchor); second trigger recorded on this evidence"}
    - {date: "2026-07-23", kind: violated-corrected, ref: "plan-8 design review round 1 m2 (design-review-round-1.md): the design asserted 'two stale comments in main.wxs' where the tree holds one comment, in mod.rs - a count-plus-location tree claim unverified at authoring, in a document whose load-bearing citations were otherwise immaculate; fix round corrects"}
    - {date: "2026-07-22", kind: decided, ref: "plan-7 T11 (task-11-verdict.md harvest, minor): topics.ts's fallback comment cites muxsmith-cli/src/i18n.rs:41-46 for the raw-id posture, but that span is Renderer::new - the actual fallback (id.to_string()) sits in render (~:123); behavior exists, span stale at authoring; one-line comment fix rides the whole-branch inputs"}
