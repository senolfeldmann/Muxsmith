name: ci
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Pinning policy (2026-07-10): actions pinned to release commit SHAs
# (movable tags are a supply-chain surface), runner images pinned to
# explicit versions (no surprise -latest bumps). Renovate/Dependabot
# update SHA pins natively once enabled (go-public).
# ubuntu-26.04 is a preview image (Şenol's call, newest line).

jobs:
  test:
    strategy:
      fail-fast: false
      # Static 3-OS matrix since going public (2026-07-10): Actions are free
      # on public-repo standard runners, so every push runs all platforms.
      # The private-era dynamic Linux-only trim is retired.
      matrix:
        os: ["ubuntu-26.04", "windows-2025", "macos-15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Bare `rustup toolchain install` does not apply rust-toolchain.toml's
      # components (rustup #4216), so they are added explicitly.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # mkvtoolnix on every leg (2026-07-11, Plan 5.5 Task 2 / #14): gated
      # integration tests previously ran live on Linux only and silently
      # self-skipped on Windows/macOS. Version-pin decision (registries
      # checked 2026-07-11, Şenol's standing preference is pin per-manager
      # unless impossible): apt on ubuntu-26.04 "resolute" (the actual
      # matrix OS, not 24.04) ships mkvtoolnix 97.0-1build1; choco and
      # brew both currently track 100.0(.0) - majors diverge, so pin
      # where the manager allows an install-time version. apt and choco
      # do; both are pinned below. Homebrew's core tap keeps no versioned
      # mkvtoolnix formula and no install-time version selector (`brew
      # pin` only locks an already-installed version against a later
      # `brew upgrade`), so brew floats on latest stable - the one
      # manager where pinning is not idiomatically possible. The apt pin
      # is an exact build (`-1build1`); an archive rebuild can supersede
      # that string and will need a bump, same maintenance shape as the
      # SHA-pin policy above.
      - name: Install mkvtoolnix (gated integration tests, Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mkvtoolnix=97.0-1build1
      - name: Install mkvtoolnix (gated integration tests, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mkvtoolnix --version=100.0.0 -y
          if (-not (Test-Path 'C:\Program Files\MKVToolNix\mkvmerge.exe')) {
            Write-Error "mkvmerge.exe not found at C:\Program Files\MKVToolNix\mkvmerge.exe after choco install"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\MKVToolNix'
      - name: Install mkvtoolnix (gated integration tests, macOS)
        if: runner.os == 'macOS'
        run: brew install mkvtoolnix
      # Tauri 2 Linux build headers (spec: current v2.tauri.app prerequisites
      # page, Task 4). Windows/macOS runners need none of this: WebView2 and
      # the system webview ship with the OS.
      - name: Install Tauri Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # One version source for node+pnpm: mise.toml (root, committed).
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Plan 5.5 Task 12 (#18b): rustdoc correctness as the ninth gate part.
      # #![deny(missing_docs)] already gates presence; it says nothing about
      # correctness, so a broken intra-doc link (queue.rs:73, linking a
      # private item) rotted silently since Plan 4 until this task. All
      # legs, matching the cross-target lint rule (cfg-gated items can
      # differ per platform).
      - name: cargo doc (rustdoc warnings as errors)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      # Task 2 (#14): assert the gated tests actually exercised mkvmerge
      # instead of silently self-skipping, now that mkvtoolnix is
      # installed on every leg. --nocapture is required: cargo test
      # captures stdout/stderr of PASSING tests by default, so the
      # self-skip eprintln would be invisible without it. --test-threads=1
      # avoids --nocapture output from concurrent test threads interleaving
      # and corrupting the marker line. A genuinely missing mkvmerge
      # (install regression) trips the count above zero and fails the
      # step - "otherwise silent skipping is traded for silent skipping"
      # (walkthrough #14).
      - name: Assert no gated tests silently skip (mkvmerge missing)
        shell: bash
        run: |
          cargo test --workspace -- --nocapture --test-threads=1 2>&1 | tee gated-test-output.log
          count="$(grep -c 'mkvmerge not found; skipping' gated-test-output.log || true)"
          echo "Skip-marker occurrences: $count"
          if [ "$count" -ne 0 ]; then
            echo "::error::$count gated integration test(s) silently skipped (mkvmerge not found on PATH) - expected 0 now that mkvtoolnix is installed on every leg."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm build
      # Task 12: i18n completeness gate + Playwright smoke. Linux-only,
      # same guard as the mkvtoolnix/webkit2gtk steps above (win/mac legs
      # still build+lint+test; they skip the browser install and the
      # smoke, which is platform-independent DOM testing). The smoke drives
      # a plain Chromium against `dist/` via `vite preview` with
      # `@tauri-apps/api/mocks` standing in for Tauri IPC (spec 10, no
      # tauri-driver) -- `pnpm build` above already produced `dist/`.
      - name: i18n completeness gate
        if: runner.os == 'Linux'
        run: pnpm check:i18n
      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright smoke (GUI e2e)
        if: runner.os == 'Linux'
        run: pnpm test:e2e

  deny:
    # Supply-chain gate (advisories, licenses, bans, sources). Cheap; runs on
    # Linux always, independent of the test matrix trim.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
