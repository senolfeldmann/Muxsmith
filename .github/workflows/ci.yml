name: ci
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Pinning policy (2026-07-10): actions pinned to release commit SHAs
# (movable tags are a supply-chain surface), runner images pinned to
# explicit versions (no surprise -latest bumps). Renovate/Dependabot
# update SHA pins natively once enabled (go-public).
# ubuntu-26.04 is a preview image (Şenol's call, newest line).

jobs:
  test:
    strategy:
      fail-fast: false
      # Private-repo minute economy: branch pushes run Linux only
      # (macOS bills 10x, Windows 2x); PRs, tags and manual dispatch
      # run the full matrix. Revert to a static 3-OS list on going public.
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) && '["ubuntu-26.04"]' || '["ubuntu-26.04", "windows-2025", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Toolchain comes from rust-toolchain.toml (pinned version incl.
      # rustfmt/clippy components); rustup on the runner auto-installs it.
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Linux-only: branch pushes are Linux-only anyway (minute economy);
      # gated integration tests self-skip on other platforms.
      # mkvtoolnix version floats with the distro; pinning it is in the
      # backlog (Şenol 2026-07-10).
      - name: Install mkvtoolnix (gated integration tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mkvtoolnix
      # Tauri 2 Linux build headers (spec: current v2.tauri.app prerequisites
      # page, Task 4). Windows/macOS runners need none of this: WebView2 and
      # the system webview ship with the OS.
      - name: Install Tauri Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # One version source for node+pnpm: mise.toml (root, committed).
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm lint
      - run: pnpm build

  deny:
    # Supply-chain gate (advisories, licenses, bans, sources). Cheap; runs on
    # Linux always, independent of the test matrix trim.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check
